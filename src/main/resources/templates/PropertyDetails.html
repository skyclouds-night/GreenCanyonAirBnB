<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Green Canyon – Property Details</title>
    <link rel="stylesheet" href=css/styles.css">
</head>
<body>

<div class="main-container">

    <!-- TOP NAVBAR -->
    <div class="navbar top-navbar hbox">
    <button class="navbar-name">GREEN CANYON</button>

    <div class="nav-links">
        <button class="navbar-buttons no-border">Properties</button>
        <button class="navbar-buttons no-border">Login</button>
    </div>

    <button class="navbar-book-now">Book Now</button>
    </div>

    <!-- CENTER CONTENT (SCROLLABLE) -->
    <div class="scroll-container">

        <div class="vbox content-container">

            <!-- PROPERTY HEADER -->
            <div class="vbox property-header">
                <span class="property-name">Name</span>
                <span class="property-address">Address</span>
            </div>

            <!-- IMAGE STACK -->
            <div class="hbox image-stack">
                <img src=img/airbnbpic1.jpg" alt="Property Image">
                <img src=img/airbnbpic1.jpg" alt="Property Image">
            </div>

            <!-- DESCRIPTION & BOOKING -->
            <div class="hbox property-main">

                <div class="vbox property-description">
                    <span class="property-name">About the Property</span>
                    <span class="property-address">Description</span>
                </div>

                <div class="vbox image-stack booking-box">
                    <span class="property-price">Price/day</span>
                    <button class="book-now">Book Now</button>
                </div>

            </div>

            <!-- PROPERTY FEATURES -->
            <div class="vbox property-features-section">
                <span class="property-name">Property Features</span>

                <div class="hbox property-features">

                    <div class="vbox property-feature">
                        <img src="img/bed icon.png" alt="Bedrooms">
                        <span>Bedrooms</span>
                    </div>

                    <div class="vbox property-feature">
                        <img src="img/bath icon.png" alt="Bathrooms">
                        <span>Bathrooms</span>
                    </div>

                    <div class="vbox property-feature">
                        <img src="img/car icon.png" alt="Parking">
                        <span>Parking</span>
                    </div>

                    <div class="vbox property-feature">
                        <img src="img/pet icon.png" alt="Pets Allowed">
                        <span>Pets Allowed</span>
                    </div>

                </div>
            </div>

            <!-- SPACER (Region) -->
            <div style="height:200px;"></div>

            <!-- FOOTER -->
            <div class="navbar hbox login-footer-container">

                <div class="vbox">
                    <span class="login-footer">Location</span>
                    <span class="login-footer-info">Taft Avenue, Manila</span>
                </div>

                <div class="vbox">
                    <span class="login-footer">Contact Number</span>
                    <span class="login-footer-info">+63 (912) 345 6789</span>
                </div>

                <div class="vbox">
                    <span class="login-footer">Email</span>
                    <span class="login-footer-info">greencanyon@gmail.com</span>
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
