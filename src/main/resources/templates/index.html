<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Green Canyon Airbnb</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="main-container">

    <!-- TOP NAVBAR -->
    <div class="navbar top-navbar hbox">
        <button class="navbar-name">GREEN CANYON</button>

        <div class="nav-links">
            <button class="navbar-buttons no-border" onclick = window.location.href="/all-properties">Properties</button>
            <button class="navbar-buttons no-border" onclick = window.location.href="/login">Login</button>
        </div>

        <button class="navbar-book-now" onclick = window.location.href="/reservation">Book Now</button>
    </div>
    <!-- SCROLLABLE CONTENT -->
    <div class="scroll-container">
        <div class="vbox content-container">

            <!-- HERO SECTION -->
            <div class="hbox hero-section">
                <div class="stack-pane">
                    <div class="stack-pane-label">
                        Your Perfect Travel Companion
                    </div>
                </div>

                <img src="img/airbnbpic.jpg"
                     alt="Airbnb Hero"
                     class="hero-image">
            </div>

            <!-- FIND PROPERTY + SEARCH BAR -->
            <div class="find-search-row">
                <span class="find-property-text">FIND A PROPERTY</span>

                <div class="hbox search-bar">

                    <div class="vbox search-item">
                        <label class="search-bar-title">Location</label>
                        <input type="text"
                               class="search-text-field"
                               placeholder="Which city do you prefer?">
                    </div>

                    <div class="separator vertical"></div>

                    <div class="vbox search-item">
                        <label class="search-bar-title">Check In</label>
                        <input type="text"
                               class="search-text-field"
                               placeholder="Add dates">
                    </div>

                    <div class="separator vertical"></div>

                    <div class="vbox search-item">
                        <label class="search-bar-title">Check Out</label>
                        <input type="text"
                               class="search-text-field"
                               placeholder="Add dates">
                    </div>

                    <div class="separator vertical"></div>

                    <div class="vbox search-item">
                        <label class="search-bar-title">Guests</label>
                        <input type="text"
                               class="search-text-field"
                               placeholder="Add guests">
                    </div>

                    <button class="search-btn">Search</button>
                </div>
            </div>

            <!-- FEATURED PROPERTIES -->
            <div class="hbox section-title">
                <span class="find-property-text">Featured Properties</span>
            </div>

            <!-- FEATURED PROPERTIES GRID -->
            <div class="featured-grid">
                <div th:each="property : ${properties}">
                    <div class="hbox listings-row">
                        <div class="vbox vbox-listings">
                            <img th:src="'data:image/jpeg;base64, + ${property.image.imageData}'" alt="Property" class="img">
                            <div>Name: <span th:text="${property.propertyName}"></span></div>
                            <div>Details: <span th:text="${property.propertyDetails}"></span></div>
                            <div>Price: <span th:text="${property.propertyPrice}"></span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <div class="navbar hbox login-footer-container">

                <div class="vbox">
                    <span class="login-footer">Location</span>
                    <span class="login-footer-info">Taft Avenue, Manila</span>
                </div>

                <div class="vbox">
                    <span class="login-footer">Contact Number</span>
                    <span class="login-footer-info">+63 (912) 345 6789</span>
                </div>

                <div class="vbox">
                    <span class="login-footer">Email</span>
                    <span class="login-footer-info">greencanyon@gmail.com</span>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
