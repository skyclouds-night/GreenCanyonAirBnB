<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Green Canyon AirBnB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="card shadow">
    <div class="card-body text-center">
        <h1 class="display-4">Green Canyon AirBnB</h1>
        <p class="lead">Welcome to the Automated Booking System.</p>
        <hr>
        <p th:text="${message}" class="text-primary"></p>
        <button class="btn btn-success">Book a Room Now</button>
    </div>
</div>
</body>
</html>
