<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Green Canyon – Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

<div class="main-container">

    <!-- TOP SECTION -->
    <div class="navbar vbox top-section">
        <img src="img/logopic.png"
             class="login-logo"
             alt="Green Canyon Logo">

        <button class="login-motto-button  no-border" onclick="window.location.href='/'">Login
            Your Perfect Travel Companion
        </button>
    </div>

    <!-- CENTER LOGIN FORM -->
    <div class="vbox login-form-container">

        <div class="vbox login-field-group">
            <label class="login-details">Username</label>
            <input id="usernameVal" type="text" class="login-text-field">
        </div>

        <div class="vbox login-field-group">
            <label class="login-details">Password</label>
            <input id="passwordVal" type="password" class="login-text-field">
        </div>

        <button id="loginBtn" class="navbar-book-now login-button">
            Log in
        </button>

        <div class="hbox">
            <button class="signup-button" onclick = window.location.href="/signup">
                New here? Sign up
            </button>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="navbar hbox login-footer-container">

        <div class="vbox">
            <span class="login-footer">Location</span>
            <span class="login-footer-info">Taft Avenue, Manila</span>
        </div>

        <div class="vbox">
            <span class="login-footer">Contact Number</span>
            <span class="login-footer-info">+63 (912) 345 6789</span>
        </div>

        <div class="vbox">
            <span class="login-footer">Email</span>
            <span class="login-footer-info">greencanyon@gmail.com</span>
        </div>

    </div>

</div>
<script>
    document.getElementById('loginBtn').addEventListener('click', function() {
        const username = document.getElementById('usernameVal').value;
        const password =  document.getElementById('passwordVal').value;
        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        })
            .then(response => {
                if (response.ok) {
                    window.location.href = "/"; // Redirect after success
                } else {
                    alert("Invalid Username or Password");
                }
            });
    });
</script>
</body>
</html>
